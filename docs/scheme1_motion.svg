<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif">
  <rect width="880" height="392" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="600" fill="#1f2328">方案一 · V2-S1 骨架实测动作范围</text>
  <text x="24" y="50" font-size="11.5" fill="#59636e">浅灰 = 设计目标，实色 = 已验证范围；绿 = 达标，橙 = 未达标</text>

  <!-- legend right -->
  <g font-size="11" fill="#59636e">
    <rect x="700" y="20" width="22" height="10" rx="2" fill="#e3e7ec" stroke="#c9d1d9"/>
    <text x="728" y="29">目标</text>
  </g>

  <!-- axis grid -->
  <g stroke="#eceff2" stroke-width="1">
    <line x1="150" y1="64" x2="150" y2="352"/>
    <line x1="325" y1="64" x2="325" y2="352"/>
    <line x1="500" y1="64" x2="500" y2="352"/>
    <line x1="675" y1="64" x2="675" y2="352"/>
  </g>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="150" y="366">0°</text>
    <text x="325" y="366">50°</text>
    <text x="500" y="366">100°</text>
    <text x="675" y="366">150°</text>
  </g>

  <!-- rows: label, target, achieved, pct, colour -->
  <g font-size="12" fill="#1f2328">
    <!-- K1 145 / 145 -->
    <text x="24" y="82">K1 肘屈曲</text>
    <rect x="150" y="70" width="507.5" height="16" rx="3" fill="#e3e7ec"/>
    <rect x="150" y="70" width="507.5" height="16" rx="3" fill="#2da44e"/>
    <text x="752" y="82" font-size="11" fill="#1a7f37">145.0 / 145</text>

    <!-- K2 113.69 / 120 -->
    <text x="24" y="124">K2 GH 前屈</text>
    <rect x="150" y="112" width="420" height="16" rx="3" fill="#e3e7ec"/>
    <rect x="150" y="112" width="397.9" height="16" rx="3" fill="#d29922"/>
    <text x="752" y="124" font-size="11" fill="#9a6700">113.7 / 120</text>

    <!-- K3 120 / 120 -->
    <text x="24" y="166">K3 GH 外展</text>
    <rect x="150" y="154" width="420" height="16" rx="3" fill="#e3e7ec"/>
    <rect x="150" y="154" width="420" height="16" rx="3" fill="#2da44e"/>
    <text x="752" y="166" font-size="11" fill="#1a7f37">120.0 / 120</text>

    <!-- K4 70 / 70 -->
    <text x="24" y="208">K4 GH 内旋</text>
    <rect x="150" y="196" width="245" height="16" rx="3" fill="#e3e7ec"/>
    <rect x="150" y="196" width="245" height="16" rx="3" fill="#2da44e"/>
    <text x="752" y="208" font-size="11" fill="#1a7f37">70.0 / 70</text>

    <!-- K5 90 / 90 -->
    <text x="24" y="250">K5 GH 外旋</text>
    <rect x="150" y="238" width="315" height="16" rx="3" fill="#e3e7ec"/>
    <rect x="150" y="238" width="315" height="16" rx="3" fill="#2da44e"/>
    <text x="752" y="250" font-size="11" fill="#1a7f37">90.0 / 90</text>

    <!-- K6 19 / 50 -->
    <text x="24" y="292">K6 肩胛上回旋</text>
    <rect x="150" y="280" width="175" height="16" rx="3" fill="#e3e7ec"/>
    <rect x="150" y="280" width="66.5" height="16" rx="3" fill="#cf222e"/>
    <text x="752" y="292" font-size="11" fill="#a40e26">19.0 / 50</text>

    <!-- K7 146.02 / 170 -->
    <text x="24" y="334">K7 联合抬升</text>
    <rect x="150" y="322" width="595" height="16" rx="3" fill="#e3e7ec"/>
    <rect x="150" y="322" width="511.1" height="16" rx="3" fill="#d29922"/>
    <text x="752" y="334" font-size="11" fill="#9a6700">146.0 / 170</text>
  </g>

  <text x="24" y="384" font-size="10.5" fill="#8b949e">
    数据来源：01_工程骨架方案/输出/skeleton_from_v2/V2-S1/README.md（2026-10-29 基线）
  </text>
</svg>
