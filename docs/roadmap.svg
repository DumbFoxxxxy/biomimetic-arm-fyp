<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">肩部扩充路线：从 GH 逐层向外</text>
  <text x="24" y="56" font-size="12" fill="#59636e">每层放开一个关节、加一组肌肉、用台架验证一次；L1 完成后才进入 L2</text>

  <!-- chain -->
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <rect x="150" y="76" width="86" height="30" rx="6" fill="#eef3f8" stroke="#b6c6d6"/>
    <text x="193" y="96">肱骨</text>
    <rect x="262" y="76" width="86" height="30" rx="6" fill="#eef3f8" stroke="#b6c6d6"/>
    <text x="305" y="96">肩胛骨</text>
    <rect x="374" y="76" width="86" height="30" rx="6" fill="#eef3f8" stroke="#b6c6d6"/>
    <text x="417" y="96">锁骨</text>
    <rect x="486" y="76" width="106" height="30" rx="6" fill="#eef3f8" stroke="#b6c6d6"/>
    <text x="539" y="96">胸骨 / 胸廓</text>
  </g>
  <g stroke="#8aa0b4" stroke-width="1.4" fill="none">
    <line x1="236" y1="91" x2="262" y2="91"/>
    <line x1="348" y1="91" x2="374" y2="91"/>
    <line x1="460" y1="91" x2="486" y2="91"/>
  </g>
  <g font-size="11" fill="#59636e" text-anchor="middle">
    <text x="249" y="70">GH</text>
    <text x="361" y="70">AC</text>
    <text x="473" y="70">SC</text>
  </g>

  <!-- arrow down -->
  <g stroke="#8aa0b4" stroke-width="1.2" fill="none">
    <path d="M440 112 L440 126" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8aa0b4"/>
    </marker>
  </defs>

  <!-- ladder -->
  <g font-size="12.5" fill="#1f2328">
    <!-- rows -->
    <g>
      <rect x="150" y="136" width="600" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="150" y="136" width="6" height="34" fill="#9bb7d4"/>
      <text x="170" y="158" font-weight="600">L1</text>
      <text x="206" y="158">肩带内肌 × GH</text>
      <text x="400" y="158" fill="#59636e">6 条力线 · 肩胛锁死 · 台架实测</text>
      <rect x="668" y="143" width="70" height="20" rx="10" fill="#ddf4e4" stroke="#8fd3a5"/>
      <text x="703" y="157" font-size="11" text-anchor="middle" fill="#1a7f37">进行中</text>
    </g>
    <g>
      <rect x="150" y="176" width="600" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="150" y="176" width="6" height="34" fill="#c9d6e2"/>
      <text x="170" y="198" font-weight="600">L2</text>
      <text x="206" y="198">肩胛可控化</text>
      <text x="400" y="198" fill="#59636e">AC / SC 变真关节 · 先用临时钢丝验运动学</text>
    </g>
    <g>
      <rect x="150" y="216" width="600" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="150" y="216" width="6" height="34" fill="#c9d6e2"/>
      <text x="170" y="238" font-weight="600">L3</text>
      <text x="206" y="238">肩胛肌肉驱动</text>
      <text x="400" y="238" fill="#59636e">斜方肌三束 / 菱形肌 / 肩胛提肌 · 需胸廓</text>
    </g>
    <g>
      <rect x="150" y="256" width="600" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="150" y="256" width="6" height="34" fill="#c9d6e2"/>
      <text x="170" y="278" font-weight="600">L4</text>
      <text x="206" y="278">宽扁肌多力线</text>
      <text x="400" y="278" fill="#59636e">前锯肌 · 一条肌腹多根钢丝</text>
    </g>
    <g>
      <rect x="150" y="296" width="600" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="150" y="296" width="6" height="34" fill="#c9d6e2"/>
      <text x="170" y="318" font-weight="600">L5</text>
      <text x="206" y="318">跨锁骨 / 躯干肌</text>
      <text x="400" y="318" fill="#59636e">胸大肌 · 锁骨下肌</text>
    </g>
    <g>
      <rect x="150" y="336" width="600" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="150" y="336" width="6" height="34" fill="#c9d6e2"/>
      <text x="170" y="358" font-weight="600">L6</text>
      <text x="206" y="358">浮动肩胛</text>
      <text x="400" y="358" fill="#59636e">接触面或韧带替代刚性约束</text>
    </g>
    <g>
      <rect x="150" y="376" width="600" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="150" y="376" width="6" height="34" fill="#c9d6e2"/>
      <text x="170" y="398" font-weight="600">L7</text>
      <text x="206" y="398">与肘部联动</text>
      <text x="400" y="398" fill="#59636e">整臂</text>
    </g>
  </g>

  <g font-size="11" fill="#59636e">
    <text x="24" y="436">肘部：已完成设计候选与试验准备，未实测（见 ELBOW_HANDOFF.md）</text>
    <text x="24" y="454">肩部：L0 中心与三轴已定；L1 尚未建模</text>
  </g>
</svg>
